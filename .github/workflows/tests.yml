name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pandoc: ["3.1.3", "3.7.0.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pandoc ${{ matrix.pandoc }}
        run: |
          curl -sSLf -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/${{ matrix.pandoc }}/pandoc-${{ matrix.pandoc }}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1
      - name: Tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
          uv sync --locked
          uv run pytest -q -p no:warnings
      - name: Wheel carries its resources
        run: |
          uv build --wheel
          python3 -m zipfile -l dist/*.whl | grep -E "static/app.js|assets/scrivmark.lua|tutorial/paper.md|skill/SKILL.md"
