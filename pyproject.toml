[project]
name = "scrivmark"
version = "0.5.0"
description = "Manuscript review on Markdown and Quarto sources: tracked changes as git edits, comment threads beside the text, a rendered viewer and an agent CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Barry W. Brook" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "watchfiles>=0.24",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[project.scripts]
scrivmark = "scrivmark.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.48"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
